<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - Mirr矩阵</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Mirr矩阵</span>
        <span class="navbar-text text-light small font-monospace" data-role="navbarClock" title="当前时间"></span>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="text-center mb-4">
            <h1 class="h3 mb-1">Mirr矩阵</h1>
            <div class="text-muted small">矩阵工程管理后台</div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body p-4">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">账号</label>
                  <input class="form-control" name="username" autocomplete="username" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">密码</label>
                  <input class="form-control" name="password" type="password" autocomplete="current-password" required />
                </div>
                <div class="mb-3 form-check">
                  <input class="form-check-input" type="checkbox" id="rememberCredentials" checked />
                  <label class="form-check-label" for="rememberCredentials">记住账号密码（保存在本机浏览器）</label>
                </div>
                <button id="btnLogin" class="btn btn-primary w-100" type="submit">登录</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { setAdminToken, toast, getAdminProfile, isPageAllowed } from "/assets/app.js";

      const form = document.getElementById("loginForm");
      const btn = document.getElementById("btnLogin");
      const rememberEl = document.getElementById("rememberCredentials");
      const LOGIN_CACHE_KEY = "fpbrowser2api_login_cache_v1";

      function loadCachedCredentials() {
        try {
          const raw = localStorage.getItem(LOGIN_CACHE_KEY);
          if (!raw) return;
          const o = JSON.parse(raw);
          if (o && typeof o.username === "string") form.username.value = o.username;
          if (o && typeof o.password === "string") form.password.value = o.password;
          rememberEl.checked = true;
        } catch (_) {}
      }

      loadCachedCredentials();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "登录中...";
        try {
          const fd = new FormData(form);
          const r = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: fd.get("username"),
              password: fd.get("password"),
            }),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || "登录失败");
          if (rememberEl.checked) {
            localStorage.setItem(
              LOGIN_CACHE_KEY,
              JSON.stringify({
                username: String(fd.get("username") || ""),
                password: String(fd.get("password") || ""),
              }),
            );
          } else {
            localStorage.removeItem(LOGIN_CACHE_KEY);
          }
          setAdminToken(d.token);
          const me = await getAdminProfile(true);
          const order = ["system", "projects", "task_types", "tasks", "watermark_tasks", "test", "image_resources", "totp", "logs", "users"];
          const pathMap = {
            system: "/admin/system",
            projects: "/admin/projects",
            task_types: "/admin/task-types",
            tasks: "/admin/tasks",
            watermark_tasks: "/admin/watermark-tasks",
            test: "/admin/test",
            image_resources: "/admin/image-resources",
            totp: "/admin/totp",
            logs: "/admin/logs",
            users: "/admin/users",
          };
          let target = "/admin/system";
          for (const key of order) {
            if (isPageAllowed(me, key)) {
              target = pathMap[key];
              break;
            }
          }
          window.location.href = target;
        } catch (err) {
          toast(err.message || "登录失败", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "登录";
        }
      });
    </script>
  </body>
</html>
