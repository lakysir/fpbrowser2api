[server]
host = "0.0.0.0"
port = 8000

[global]
admin_username = "admin"
admin_password = "admin"
api_key = "fpb123456"

[system]
# 是否默认启用代理（影响自动化/对外请求）
proxy_enabled = false
proxy_url = ""

# 是否启用调试模式（更详细的日志）
debug_enabled = false

# 是否把日志写入本地文件（fpbrowser2api/app.log）
log_to_file = false

[extension_executor]
# 是否全局默认使用浏览器插件执行器；false 时可在单个任务 payload 里传 executor="extension" 启用。
enabled = false
base_url = "192.168.1.4:8000"
# 指纹浏览器插件连接 Python 后端的 WebSocket 地址为f"ws://{base_url}/api/extension/ws"
# 插件配置中转页：Python 先打开f"http://{base_url}/"页面写入 fpb_* 与 redirect_url，插件连接 WS 后再跳转目标站点。
# 可选鉴权 token；留空则不校验
bridge_token = ""
task_timeout_seconds = 1800

[ai_agent]
# 大模型中转站地址在代码中固定为 https://www.newtoken.club/，这里仅配置默认模型和默认 API Key。
# 也可用环境变量 AI_AGENT_API_KEY / NEWTOKEN_API_KEY / OPENAI_API_KEY 注入，优先级高于本配置。
default_model = "gpt-5.5"
api_key = ""

# 视频后处理（去水印 / 1080p 超分）：两者都由外部服务 onnx_watermark_service 提供。
# 默认全部关闭：未部署该服务时不会产生任何外部请求，视频结果保持原样返回。
[video_postprocess]
# Whether to mosaic faces in VEO reference images and videos; false skips the mosaic service
face_mosaic = true
# 生成成功后把视频交给外部服务去水印
remove_watermark = false
# *-1080p 模型：去水印之后再做一次 1080p 超分，成功则返回超分地址
upscale_1080p = false
# 外部服务根地址（去水印 POST {base}/process-video，超分 POST/GET {base}/v1/videos）
service_base_url = ""
# 后处理服务按顺序尝试；用于人脸马赛克和 1080p 超分，未配置时使用 service_base_url
service_base_urls = []
# 超分总时长上限（秒）；含名额满时的重试等待。超时按失败处理，返回超分前的地址
upscale_timeout_seconds = 1500
# 超分名额满（HTTP 503）时的重试间隔（秒）；<=0 表示不重试，直接按失败处理
upscale_retry_interval_seconds = 20

[comfyui_dispatch]
# Centralized ComfyUI scheduler used by watermark_tasks admin status.
base_url = "http://127.0.0.1:8891"

# Generated images are uploaded to Cloudflare R2 so task results contain public URLs instead of large data URLs.
[r2]
enabled = false
endpoint = "https://<account-id>.r2.cloudflarestorage.com"
region = "auto"
bucket = "your-bucket"
public_base_url = "https://pub-<bucket-id>.r2.dev"
# Credentials may also be supplied through R2_ACCESS_KEY_ID / R2_ACCESS_KEY_SECRET.
# access_key_id = ""
# access_key_secret = ""

